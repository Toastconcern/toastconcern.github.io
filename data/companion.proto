// Quest CompanionServer wire protocol, reverse-engineered from
// com.oculus.companion.server. Used by js/companion.js to talk to a headset
// over Web Bluetooth. The @@ comment annotations drive the generated UI
// (tab / group / title / request / response / priority / confirm / primary / ui).
// Source: github.com/ptrpaws/quest-ble-client. MetaDB is not affiliated with Meta.

// reverse engineered from com.oculus.companion.server.protocol

syntax = "proto2";

package quest;
option java_package = "com.quest.companionclient";
option java_outer_classname = "Proto";
option optimize_for = CODE_SIZE;

message Request {
  optional int32 version = 1;
  optional Method method = 2;
  optional int32 seq = 3;
  optional bytes body = 4;
  optional string device_address = 5;
  optional int64 connection_session = 6;
}

message Response {
  optional int32 seq = 1;
  optional ResponseCode code = 2;
  optional bytes body = 3;
}

message BlePairingKey {
  optional sint32 key = 1;
}

message ErrorDetails {
  optional ErrorCode code = 1;
  optional string debug_details = 2;
  optional string localized_user_facing_description = 3;
  optional BlePairingKey ble_pairing_key = 4;
  optional int32 code_v2 = 5;
}

enum Method {
  UNKNOWN = 99999;
  PING = 0;
  // @@request: HelloRequest
  // @@response: HelloResponse
  HELLO = 1;
  // @@request: AuthenticateRequest
  AUTHENTICATE = 2;
  // @@tab: "NETWORK"
  // @@group: "WI-FI STATUS & STATE"
  // @@priority: 1
  // @@title: "Scan Networks"
  // @@response: WifiScanResponse
  // @@help: "Lists the Wi-Fi networks the headset can currently see, each with its SSID, signal strength and security type. Nothing to fill in."
  WIFI_SCAN = 1001;
  // @@request: WifiConnectRequest
  // @@tab: "NETWORK"
  // @@group: "CONNECT TO NETWORK"
  // @@priority: 2
  // @@title: "Connect to Wi-Fi Network"
  // @@buttonLabel: "Connect"
  // @@primary
  // @@help: "Joins the headset to a Wi-Fi network and confirms it can reach the internet. Use the auth/hidden options only for enterprise or hidden networks."
  // @@field.ssid: "The exact network name to join, e.g. one returned by Scan Networks."
  // @@field.password: "The network's password; leave empty for an open network."
  // @@field.username: "Login name for enterprise (EAP) networks only; leave empty otherwise."
  WIFI_CONNECT = 1002;
  // @@tab: "NETWORK"
  // @@group: "WI-FI STATUS & STATE"
  // @@priority: 1
  // @@title: "Get Status"
  // @@response: WifiStatusResponse
  // @@help: "Reports whether Wi-Fi is on, the current network, whether Oculus servers are reachable, and the list of saved networks. Nothing to fill in."
  WIFI_STATUS = 1003;
  // @@request: WifiForgetRequest
  // @@tab: "NETWORK"
  // @@group: "RECONNECT / FORGET"
  // @@priority: 3
  // @@title: "Forget Wi-Fi Network"
  // @@buttonLabel: "Forget"
  // @@confirm: "ARE YOU SURE YOU WANT TO FORGET THIS WI-FI NETWORK?"
  // @@primary
  // @@help: "Removes a saved Wi-Fi network so the headset stops auto-joining it. The network is identified by its SSID (from Get Status's known networks)."
  WIFI_FORGET = 1004;
  // @@tab: "NETWORK"
  // @@group: "WI-FI STATUS & STATE"
  // @@priority: 1
  // @@title: "Enable Wi-Fi"
  // @@help: "Turns the headset's Wi-Fi radio on and waits up to 30s for it to come up. Nothing to fill in."
  WIFI_ENABLE = 1005;
  // @@tab: "NETWORK"
  // @@group: "WI-FI STATUS & STATE"
  // @@priority: 1
  // @@title: "Disable Wi-Fi"
  // @@help: "Turns the headset's Wi-Fi radio off. Nothing to fill in."
  WIFI_DISABLE = 1006;
  // @@request: WifiReconnectRequest
  // @@tab: "NETWORK"
  // @@group: "RECONNECT / FORGET"
  // @@priority: 3
  // @@title: "Reconnect"
  // @@help: "Reconnects the headset to a network it has already saved, selected by name."
  // @@field.ssid: "The SSID of a network the headset already has saved."
  WIFI_RECONNECT = 1007;
  OCULUS_LOGIN_DEPRECATED = 2001;
  // @@tab: "SECURITY"
  // @@group: "ACCOUNT TOKENS"
  // @@priority: 4
  // @@title: "Oculus Logout"
