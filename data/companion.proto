}
message PassAndTryStatusResponse {
  optional bool is_active = 1;
}

// ---- Wi-Fi Easy Connect (DPP) ----
// cryptography_curve is a plain int32 on the wire (Android EASY_CONNECT_
// CRYPTOGRAPHY_CURVE_*): 0=prime256v1, 1=secp384r1, 2=secp521r1, 3=brainpoolP256r1.
message WifiEasyConnectRequest {
  optional string device_info = 1;
  optional int32 cryptography_curve = 2;
}
message WifiEasyConnectResponse {
  optional string bootstrap_uri = 1;
}

// ---- phone Bluetooth auto-pairing ----
message PhoneBtEnableAutoPairingRequest {
}
message PhoneBtEnableAutoPairingResponse {
  optional string br_edr_address = 1;
}

// ---- security: backup PIN (request only; success/failure is the base Response) ----
message SyncBackupPinRequest {
  optional string pin = 1;
}

