}

// ---- device provisioning / certificates (provision_state: 1=not provisioned,
//      2=provisioned) ----
message DeviceGenerationIdResponse {
  optional string device_generation_id = 1;
}
message DeviceProvisionRequest {
  optional string registration_challenge_pkg = 1;
}
message DeviceProvisionResponse {
  optional string registration_package = 1;
  optional string registration_signer = 2;
  optional int32 provision_state = 3;
}
message DeviceProvisionStateResponse {
  optional int32 provision_state = 1;
}
message DeviceRegistrationChallengeResponse {
  optional int32 provision_state = 1;
  optional string registration_challenge_request_package = 2;
}
