  // @@request: MetaSetAccessTokenRequest
  META_SET_ACCESS_TOKEN = 2301;
  // @@request: CombinedSetAccessTokenRequest
  // @@tab: "SECURITY"
  // @@group: "ACCOUNT TOKENS"
  // @@priority: 4
  // @@title: "Set Combined Token (advanced)"
  // @@help: "Advanced: signs in BOTH a Meta (com.meta) and a Horizon (com.oculus) account at once. The Meta slot needs a genuine Meta-account token, which MetaDB usually does not have — for a normal sign-in use Sign the headset into your account above. Device must be unlocked, primary user."
