// ---- prescription lenses ----
message PrescriptionLensPairRequest {
  optional string serial_number = 1;
  optional string lens_model = 2;
  optional string serial_number_os = 3;
  optional string serial_number_od = 4;
}
message PrescriptionLensPairResponse {
  optional PrescriptionLensState state = 1;
  optional PrescriptionLensError error = 2;
  optional string serial_number = 3;
}
message PrescriptionLensUnpairRequest {
  optional string serial_number = 1;
}
message PrescriptionLensUnpairResponse {
  optional PrescriptionLensState state = 1;
  optional PrescriptionLensError error = 2;
}
message PrescriptionLensStatusResponse {
  optional PrescriptionLensState state = 1;
  optional string serial_number = 2;
  optional string lens_model = 3;
}
