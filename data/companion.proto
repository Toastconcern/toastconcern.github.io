  optional bool first_time_nux_cycles_locale = 8;
  optional string first_time_nux_country = 9;
  optional string first_time_nux_language = 10;
  optional bool nux_twf_active = 11;
  optional int32 ota_time_estimation = 12;
  optional string first_time_nux_selected_locale = 13;
  optional string first_time_nux_current_flow = 14;
  optional string first_time_nux_current_step = 15;
  optional string first_time_nux_active_setup_phase = 16;
