  LENS_STATE_ERROR = 4;
}
enum PrescriptionLensError {
  LENS_ERROR_NONE = 0;
  LENS_ERROR_INVALID_SERIAL = 1;
  LENS_ERROR_ALREADY_PAIRED = 2;
  LENS_ERROR_NOT_PAIRED = 3;
  LENS_ERROR_PAIRING_IN_PROGRESS = 4;
  LENS_ERROR_INCOMPATIBLE = 5;
  LENS_ERROR_SERVICE_UNAVAILABLE = 6;
  LENS_ERROR_INTERNAL = 7;
  LENS_ERROR_NETWORK = 8;
  LENS_ERROR_DATA_NOT_FOUND = 9;
  LENS_ERROR_NOT_PAIRING = 10;
}

