}

// ---- credential transfer (every credential field is a real secret) ----
message CredentialImportRequest {
  repeated CredentialEntry credentials = 1;
}
message CredentialImportResponse {
  optional bool success = 1;
  optional string error_message = 2;
}
message CredentialExportRequest {
}
message CredentialExportResponse {
  optional bool success = 1;
  repeated CredentialEntry credentials = 2;
  optional string error_message = 3;
}
message CredentialEntry {
  optional CredentialEntityType entity_type = 1;
  optional string domain = 2;
  optional string package_name = 3;
  optional string display_name = 4;
  optional int64 created_at = 5;
  optional int64 updated_at = 6;
  oneof credential_data {
    PasswordData password_data = 7;
    PasskeyData passkey_data = 8;
  }
}
message PasswordData {
  optional string username = 1;
  optional string password = 2;
}
message PasskeyData {
  optional string username = 1;
  optional bytes private_key = 2;
  optional string credential_id = 3;
  optional string rp_id = 4;
  optional string user_id = 5;
}
enum CredentialEntityType {
  CREDENTIAL_PASSWORD = 0;
  CREDENTIAL_PASSKEY = 1;
}
