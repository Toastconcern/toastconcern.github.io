  OCULUS_LOGOUT = 2002;
  // @@request: OculusSetUserSecretRequest
  // @@tab: "SECURITY"
  // @@group: "NUX ACTIONS"
  // @@priority: 6
  // @@title: "Set User Secret Key"
  // @@confirm: "SEND CURRENT DEVICE SECRET TO HEADSET AS NEW USER SECRET KEY? (USED AFTER FACTORY RESET). CONTINUE?"
  // @@help: "Claims a freshly factory-reset headset by storing a user secret on it; works only once, on an unclaimed device, as the primary user."
  // @@field.user_secret_key: "The 64-character hex device secret from the box at the top of the page."
  OCULUS_SET_USER_SECRET = 2003;
  // @@request: OculusSetAccessTokenRequest
  // @@tab: "SECURITY"
  // @@group: "ACCOUNT TOKENS"
  // @@priority: 3
  // @@title: "Sign the headset into your account"
  // @@buttonLabel: "Sign in"
  // @@primary
  // @@help: "Signs the headset into your Oculus/Horizon account with your access token and account ID. This is the account MetaDB can fill from your own login; the headset must be unlocked and on the primary user."
  // @@field.access_token: "Your access token — the one MetaDB signs you in with (your Settings token). Filled in for you."
  // @@field.user_id: "Your account's numeric ID, from your signed-in session. Filled in for you."
  OCULUS_SET_ACCESS_TOKEN = 2004;
  // @@request: OculusSecondaryAccountLoginRequest
  OCULUS_SECONDARY_ACCOUNT_LOGIN = 2005;
  OCULUS_INSERT_LINKED_ACCOUNT_DEPRECATED = 2101;
  // @@tab: "SECURITY"
  // @@group: "SECONDARY USER MANAGEMENT"
  // @@priority: 5
  // @@title: "Add Secondary User"
  // @@help: "Creates a new secondary (guest) user on the headset; needs multi-user enabled and the primary user in front. Nothing to fill in."
  OCULUS_SECONDARY_USER_ADD = 2201;
  // @@request: OculusSecondaryUserRemoveRequest
  // @@tab: "SECURITY"
  // @@group: "SECONDARY USER MANAGEMENT"
  // @@priority: 5
  // @@title: "Remove Secondary User"
  // @@buttonLabel: "Remove"
